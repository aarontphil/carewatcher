[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "carewatcher"
version = "0.2.0"
description = "Privacy-preserving ambient healthcare companion for passive wellness monitoring"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyserial>=3.5",
    "pyttsx3>=2.90",
    "llama-cpp-python>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
ble = [
    "bleak>=0.21",
]
piper = [
    "piper-tts>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["carewatcher*"]
